<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nakshatra Guide Dashboard</title>
    <link rel="stylesheet" href="style.css?v=115">
</head>
<body>

    <canvas id="starfield-bg"></canvas>

    <div class="dashboard-container">
        
        <!-- Top Row 3-Panel Layout -->
        <div class="dashboard-row-three-columns">
            
            <!-- PANEL 1: Astrological Profile (DOB Input) -->
            <div class="card outlined-card" id="profileFormPanel">
                <div class="card-header">Astrological Profile</div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="dob">Date of Birth (DD-MM-YYYY)</label>
                        <input type="text" id="dob" placeholder="DD-MM-YYYY" maxlength="10" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="tob">Time of Birth</label>
                        <input type="time" id="tob" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="birth-place-input">Place of Birth (City)</label>
                        <input type="text" id="birth-place-input" placeholder="e.g. Chennai" value="Chennai">
                    </div>

                    <div class="form-group" style="margin-top: 12px;">
                        <label for="country-input">Country</label>
                        <input type="text" id="country-input" placeholder="e.g. India" value="India">
                    </div>
                    
                    <button id="submitBtn" class="btn primary-btn" style="margin-top: 20px; width: 100%;">Submit</button>
                </div>
            </div>

            <!-- PANEL 2 (CENTER): Logo Only -->
            <div class="card branding-card-panel" style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
                <div class="branding-image-container" style="max-height: 140px;">
                    <img src="ng head.jpg" alt="Nakshatra Guide Logo" class="scaled-panel-img">
                </div>
            </div>

            <!-- PANEL 3: Detected Nakshatra Panel -->
            <div class="card outlined-card" id="detectedStatusPanel">
                <div class="card-header">Detected Nakshatra</div>
                <div class="card-body">
                    <div id="detectedNakshatra" class="highlight-text">Waiting for Birth Details</div>
                    <div id="detectedPada" class="sub-highlight-text"></div>
                    <div id="activeForecastDateDisplay" style="margin-top: 4px; font-size: 0.88rem; color: rgba(255, 204, 0, 0.85); font-weight: bold;"></div>
                    
                    <div class="rasi-zodiac-details" style="margin-top: 15px;">
                        <div>Vedic Sign (Rasi): <strong id="vedicRasi">-</strong></div>
                        <div style="margin-top: 8px;">Zodiac Sign: <strong id="westernZodiac">-</strong></div>
                    </div>

                    <!-- Animated Birthday Wish Banner (Placed below Western Sign & above Reset Button) -->
                    <div id="birthdayGreetingBox" style="display: none; margin-top: 15px; padding: 10px; background: rgba(255, 215, 0, 0.15); border: 1px solid rgba(255, 215, 0, 0.6); border-radius: 8px; text-align: center; animation: birthdayGlow 1.8s infinite ease-in-out;">
                        <span style="font-size: 1.05rem; font-weight: bold; color: #ffd700;">🎂 Happy Birthday!</span><br>
                        <span style="font-size: 0.82rem; color: #ffffff;">May the transits bring light & progress for your solar return year.</span>
                    </div>
                    
                    <div class="action-buttons-group" style="margin-top: 20px;">
                        <button id="confirmBtn" style="display: none;" class="btn confirm-btn">Confirm</button>
                        <button id="rejectBtn" style="display: none;" class="btn reject-btn">Reject</button>
                        <button id="resetBtn" style="display: none;" class="btn reset-btn" style="width: 100%;">Reset Profile</button>
                    </div>
                </div>
            </div>

        </div>

        <hr class="golden-dashboard-divider">

        <!-- Mobile Submenu Navigation (Cleaned down to 2 options: Forecast & History) -->
<div id="mobile-navigation-bar" style="display: none; overflow-x: auto; white-space: nowrap; padding: 10px 5px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); scrollbar-width: none; -webkit-overflow-scrolling: touch;">
    <button class="nav-tab" onclick="switchMobileTab('forecast')" style="background: none; border: none; color: #ffffff; padding: 8px 16px; font-family: inherit; font-size: 1rem; cursor: pointer; font-weight: bold;">Forecast</button>
    <button class="nav-tab" onclick="switchMobileTab('history')" style="background: none; border: none; color: rgba(255,255,255,0.6); padding: 8px 16px; font-family: inherit; font-size: 1rem; cursor: pointer;">History</button>
</div>

<!-- Bottom Row Panels (Forecast + Combined Guidance, and History) -->
<div id="forecastAndAttentionPanels" style="display: none; margin-top: 20px;">
    
    <!-- Combined Daily Forecast & Guidance Card -->
    <div class="card" id="card-forecast">
        <div class="card-header">
            <h3>Daily Forecast</h3>
        </div>
        <div class="card-body">
            <!-- Forecast Text -->
            <div id="forecastBox">Calculating coordinates...</div>

            <hr style="border: 0; border-top: 1px dashed rgba(255, 215, 0, 0.25); margin: 15px 0;">

            <!-- Combined Guidance Details -->
            <div id="guidanceBox" style="font-size: 0.95rem; line-height: 1.8;">
                <div><strong style="color: #ffd700;">Lucky Color:</strong> <span id="luckyColor">-</span></div>
                <div><strong style="color: #ffd700;">Lucky Time:</strong> <span id="goodTime">-</span></div>
                <div><strong style="color: #ffd700;">Unlucky Time:</strong> <span id="badTime">-</span></div>
            </div>
        </div>
    </div>

    <!-- History Panel -->
    <div class="card" id="card-history">
        <div class="card-header">
            <h3>History</h3>
        </div>
        <div class="card-body">
            <div id="attentionBox"></div>
        </div>
    </div>
    
</div>

    <script type="module" src="js/index_app.js?v=130"></script>
</body>
</html>
